<!DOCTYPE html>
<html lang="fa" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>پست‌ساز ساز و راز</title>
<link rel="stylesheet" href="/assets/theme.css"><style id="cfg"></style><link id="fontlink" rel="stylesheet" href="">
<style>
#fab{position:fixed;bottom:18px;left:18px;z-index:200;width:58px;height:58px;border-radius:50%;border:3px solid #000;background:var(--c-sheets);color:#fff;box-shadow:4px 4px 0 #000;display:grid;place-items:center}
#fab .ic{width:26px;height:26px}
#pnl{position:fixed;z-index:210;background:#12141c;color:#eee;border:3px solid #000;display:flex;flex-direction:column;font-size:13px;line-height:1.7;bottom:0;left:0;right:0;height:78vh;border-radius:20px 20px 0 0;transform:translateY(105%);transition:transform .3s}
#pnl.open{transform:none}
@media(min-width:900px){#pnl{top:0;bottom:0;left:0;right:auto;width:440px;height:auto;border-radius:0 20px 20px 0;transform:translateX(-105%)}}
.ph-h{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:2px solid #000;background:#1b202c}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;border-bottom:2px solid #000;scrollbar-width:none}
.tabs button{flex:none;padding:6px 14px;border-radius:9px;border:2px solid #000;background:#262c3b;color:#cfd3de;font-weight:800;font-size:12px}
.tabs button.on{background:var(--c-compose);color:#111}
#body{flex:1;overflow:auto;padding:14px 16px 90px}
.f{display:flex;flex-direction:column;gap:3px;margin-bottom:11px}
.f>span{font-size:11px;color:#9aa3b5}
.f input[type=text],.f input[type=url],.f input[type=password],.f input[type=date],.f textarea,.f select{background:#1b202c;border:2px solid #000;border-radius:9px;color:#fff;padding:8px 10px;font:inherit;width:100%}
.f textarea{min-height:90px;resize:vertical}
.f.row{flex-direction:row;align-items:center;gap:10px}.f.row>span{font-size:12px;color:#eee}
.ltr{direction:ltr;text-align:left}
details.d{background:#181b25;border:2px solid #000;border-radius:12px;padding:8px 12px;margin-bottom:10px}
details.d>summary{cursor:pointer;font-weight:800;padding:4px 0}
.bar{display:flex;gap:6px;margin:6px 0;flex-wrap:wrap}
.bar button,.pb{padding:6px 12px;border-radius:8px;border:2px solid #000;background:#262c3b;color:#fff;font-weight:800;font-size:12px}
.pb{background:var(--c-mix);color:#111;width:100%;padding:10px;margin-bottom:8px;font-size:13px}
.pb.dg{background:#ff6b81;color:#fff}.pb.s{background:#262c3b;color:#fff}
.note{font-size:11px;color:#9aa3b5;background:#181b25;border:2px dashed #333;border-radius:10px;padding:8px 10px;margin:8px 0}
#st{white-space:pre-wrap;font-size:12px;margin-top:8px;color:var(--c-mix)}
h4.g{margin:14px 0 8px;font-size:12px;color:var(--c-compose)}
.pl{display:flex;justify-content:space-between;gap:8px;align-items:center;background:#181b25;border:2px solid #000;border-radius:10px;padding:8px 10px;margin-bottom:8px}
.ok{color:var(--c-mix)}.bad{color:#ff8a9a}
#stage{padding-bottom:90px}
</style></head>
<body>
<div id="stage"></div>
<button id="fab" aria-label="ویرایشگر"></button>
<div id="pnl" role="dialog" aria-label="ویرایشگر پست"><div class="ph-h"><b>✍️ پست‌ساز ساز و راز</b><button class="pb s" style="width:auto;margin:0;padding:4px 12px" id="x">بستن</button></div><div class="tabs" id="tabs"></div><div id="body"></div></div>
<input type="file" id="imgf" accept="image/*" hidden>
<script src="/assets/render.js"></script>
<script>
(function(){
'use strict';
var R=window.SRR, DBK='SR_POSTS_V1', HOMEK='SR_HOME_V1';
function clone(o){return JSON.parse(JSON.stringify(o))}
function esc(s){return R.esc(s)}
function merge(a,b){if(Array.isArray(b))return b;if(b&&typeof b==='object'&&a&&typeof a==='object'&&!Array.isArray(a)){var o={},k;for(k in a)o[k]=a[k];for(k in b)o[k]=(k in a)?merge(a[k],b[k]):b[k];return o}return b===undefined?a:b}
function today(){return new Date().toLocaleDateString('sv-SE')}
function newPost(){var p=clone(R.POST_DEFAULT);p._id='d'+Date.now().toString(36);p.slug='post-'+Date.now().toString(36).slice(-5);p.date=today();return p}

/* ----- تنظیمات سایت (برای هدر/فوتر/رنگ‌ها) ----- */
var S=clone(R.DEFAULTS);
try{var h=JSON.parse(localStorage.getItem(HOMEK)||'null');if(h)S=merge(S,h)}catch(e){}
function fixUrl(){if(/example\.com/.test(S.site.url))S.site.url=location.origin}fixUrl();
fetch('/data/site.config.json',{cache:'no-cache'}).then(function(r){return r.ok?r.json():null}).then(function(c){if(c){S=merge(clone(R.DEFAULTS),c);fixUrl();draw()}}).catch(function(){});

/* ----- پیش‌نویس‌ها ----- */
var DB={cur:'',drafts:{}};
try{var d=JSON.parse(localStorage.getItem(DBK)||'null');if(d&&d.drafts)DB=d}catch(e){}
var P=DB.drafts[DB.cur];if(!P){P=newPost();DB.cur=P._id;DB.drafts[P._id]=P}
P=merge(clone(R.POST_DEFAULT),P);DB.drafts[P._id]=P;
function save(){DB.drafts[P._id]=P;try{localStorage.setItem(DBK,JSON.stringify(DB))}catch(e){}}

/* ----- پیش‌نمایش زنده ----- */
var stage=document.getElementById('stage'),tmr;
function nz(x){return String(x||'').replace(/\u200c/g,' ').replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/\s+/g,' ').toLowerCase()}
function has(a,k){return nz(a).indexOf(nz(k))>=0}
function bid(){return 'k'+Math.random().toString(36).slice(2,7)}
function draw(){
  P.blocks.forEach(function(b){if(!b.id)b.id=bid()});
  var ci=R.catInfo(S,P.cat);
  document.getElementById('cfg').textContent=R.cssVars(S);
  var fl=R.fontLink(S);document.getElementById('fontlink').href=fl||'';
  document.body.className=(S.ui.dots?'dots ':'')+'t-'+ci.theme;
  stage.innerHTML=R.header(S,ci.dir)+'<main class="wrap">'+R.postBody(S,P,{preview:true})+'</main>'+R.footer(S);
}
function refresh(){clearTimeout(tmr);tmr=setTimeout(function(){draw();save()},160)}

/* ----- ابزار فیلد ----- */
function get(path){return path.split('.').reduce(function(o,k){return o==null?o:o[k]},P)}
function set(path,v){var a=path.split('.'),o=P;for(var i=0;i<a.length-1;i++)o=o[a[i]];o[a[a.length-1]]=v}
function F(path,label,type,extra){
  var v=get(path);v=v==null?'':v;
  if(type==='area')return'<label class="f"><span>'+label+'</span><textarea data-p="'+path+'">'+esc(v)+'</textarea></label>';
  if(type==='bool')return'<label class="f row"><input type="checkbox" data-p="'+path+'"'+(v!==false&&v?' checked':'')+'><span>'+label+'</span></label>';
  if(type==='sel')return'<label class="f"><span>'+label+'</span><select data-p="'+path+'">'+extra.map(function(o){return'<option value="'+o[0]+'"'+(String(o[0])===String(v)?' selected':'')+'>'+o[1]+'</option>'}).join('')+'</select></label>';
  if(type==='img')return'<label class="f"><span>'+label+'</span><input type="text" class="ltr" data-p="'+path+'" value="'+esc(v)+'"></label><div class="bar"><button data-a="up" data-t="'+path+'">⬆️ آپلود تصویر از گوشی</button></div>';
  return'<label class="f"><span>'+label+'</span><input type="'+(type||'text')+'"'+(type==='ltr'?' class="ltr"':'')+' data-p="'+path+'" value="'+esc(v)+'"></label>';
}
function FL(path,label,type,extra){return F(path,label,type==='ltr'?'text':type,extra).replace('<input type="text"','<input type="text" class="ltr"')}

/* ----- بلوک‌ها ----- */
var BF={
 paragraph:[['text','متن (بین پاراگراف‌ها یک خط خالی بگذار؛ **پررنگ** و [متن](لینک) پشتیبانی می‌شود)','area']],
 heading:[['text','عنوان'],['level','اندازه','sel',[[2,'بزرگ (H2)'],[3,'کوچک (H3)']]]],
 image:[['src','آدرس تصویر','img'],['alt','توضیح تصویر (برای سئو و نابینایان)'],['caption','زیرنویس (اختیاری)']],
 video:[['url','لینک ویدیوی یوتیوب'],['title','عنوان ویدیو']],
 soundcloud:[['url','لینک آهنگ در ساندکلاد (https://soundcloud.com/...)'],['title','عنوان']],
 audio:[['src','آدرس فایل mp3'],['title','عنوان'],['dl','نمایش دکمهٔ دانلود','bool']],
 aparat:[['url','لینک ویدیو در آپارات (aparat.com/v/...) یا کد iframe آن'],['title','عنوان ویدیو']],
 lottie:[['url','آدرس فایل لوتی (https — فرمت .json یا .lottie)'],['height','ارتفاع (px)','num'],['title','عنوان (برای دسترسی‌پذیری)']],
 embed:[['code','کد کامل HTML / CSS / JavaScript (انیمیشن، Hyperframes، GSAP و ...)','code'],['height','ارتفاع (px)','num'],['title','عنوان (برای دسترسی‌پذیری)']],
 anchors:[['title','عنوان کادر (خالی = پرش سریع به بخش‌ها)']],
 adbanner:[['mode','نوع بنر','sel',[['image','تصویر / گیف'],['code','کد متحرک (HTML / CSS / JS / Hyperframes)']]],['src','آدرس تصویر یا گیف','img'],['href','لینک مقصد (با کلیک روی بنر)'],['alt','توضیح تصویر'],['code','کد کامل (فقط برای نوع «کد متحرک»)','code'],['height','ارتفاع کد (px)','num'],['label','برچسب بالای بنر (خالی = تبلیغات ؛ یک خط تیره - = بدون برچسب)']],
 highlight:[['label','عنوان کادر (خالی = نکتهٔ مهم)'],['text','متن نکته','area']],
 list:[['text','هر خط یک مورد','area']],
 button:[['label','متن دکمه'],['href','لینک (دانلود/صفحه)'],['note','توضیح کنار دکمه']],
 divider:[],
 gate:[['level','چه کسانی بتوانند ببینند؟','sel',[['login','همهٔ کاربران واردشده (لاگین)'],['premium','فقط کاربران پرمیوم']]],['count','تعداد بلوک‌های بعدی که زیرمجموعهٔ این بلوک‌اند','num'],['gmsg','پیام برای کسانی که دسترسی ندارند (خالی = پیام پیش‌فرض)']]
};
var LOCKS={};
function calcLocks(){LOCKS={};var a=P.blocks;for(var i=0;i<a.length;i++){if(a[i].t==='gate'){var n=Math.max(0,Math.min(parseInt(a[i].count,10)||0,a.length-i-1));for(var k=i+1;k<=i+n;k++)LOCKS[k]=a[i].level==='premium'?'p':'l';i+=n}}}
function blockUI(b,i){
  var rows=(BF[b.t]||[]).map(function(f){
    var v=b[f[0]]==null?'':b[f[0]],lab=f[1],t=f[2];
    if(t==='area')return'<label class="f"><span>'+lab+'</span><textarea data-b="'+i+'" data-k="'+f[0]+'">'+esc(v)+'</textarea></label>';
    if(t==='code')return'<label class="f"><span>'+lab+'</span><textarea class="ltr" dir="ltr" spellcheck="false" style="min-height:200px;font-family:monospace;font-size:12px" data-b="'+i+'" data-k="'+f[0]+'">'+esc(v)+'</textarea></label>';
    if(t==='bool')return'<label class="f row"><input type="checkbox" data-b="'+i+'" data-k="'+f[0]+'"'+(v?' checked':'')+'><span>'+lab+'</span></label>';
    if(t==='sel')return'<label class="f"><span>'+lab+'</span><select data-b="'+i+'" data-k="'+f[0]+'">'+f[3].map(function(o){return'<option value="'+o[0]+'"'+(String(v)===String(o[0])?' selected':'')+'>'+o[1]+'</option>'}).join('')+'</select></label>';
    var im=t==='img'?'<div class="bar"><button data-a="up" data-t="b'+i+'.'+f[0]+'">⬆️ آپلود تصویر از گوشی</button></div>':'';
    var ltr=/آدرس|لینک/.test(lab)?' class="ltr"':'';
    return'<label class="f"><span>'+lab+'</span><input type="text"'+ltr+' data-b="'+i+'" data-k="'+f[0]+'" value="'+esc(v)+'"></label>'+im;
  }).join('');
  var sel=function(k,lab,opts){return'<label class="f"><span>'+lab+'</span><select data-b="'+i+'" data-k="'+k+'">'+opts.map(function(o){return'<option value="'+o[0]+'"'+((b[k]||'')===o[0]?' selected':'')+'>'+o[1]+'</option>'}).join('')+'</select></label>'};
  var AL=[['right','راست‌چین'],['center','وسط‌چین'],['left','چپ‌چین'],['justify','دوطرفه (Justify)']],WD=[['lg','بزرگ (۸۰٪)'],['md','متوسط (۶۰٪)'],['sm','کوچک (۴۰٪)']],media=/^(image|video|aparat|soundcloud|audio|embed|lottie|highlight|adbanner)$/.test(b.t);
  var SAME=[['','مثل پیش‌فرض']];
  if(b.t!=='divider'&&b.t!=='anchors'&&b.t!=='gate'){rows+=sel('align','چینش — پیش‌فرض (موبایل و دسکتاپ)',[['','پیش‌فرض']].concat(AL))+sel('alignD','چینش فقط در دسکتاپ',SAME.concat(AL))+sel('alignM','چینش فقط در موبایل',SAME.concat(AL))}
  if(media){rows+=sel('w','اندازه — پیش‌فرض (موبایل خودکار کمی بزرگ‌تر می‌شود)',[['','کامل']].concat(WD))+sel('wD','اندازه فقط در دسکتاپ',SAME.concat([['full','کامل']],WD))+sel('wM','اندازه فقط در موبایل',SAME.concat([['full','کامل']],WD))}
  if(b.t!=='divider'&&b.t!=='anchors'&&b.t!=='gate')rows+='<label class="f"><span>نام این بلوک در لنگر (اختیاری؛ خالی = خودکار)</span><input type="text" data-b="'+i+'" data-k="alabel" value="'+esc(b.alabel||'')+'"></label>';
  if(b.t==='anchors'){
    rows+='<div class="f"><span>این بلوک‌ها در فهرست لنگر بیایند (با کلیک روی هر مورد، صفحه به همان بلوک می‌رود):</span></div>'+P.blocks.map(function(x,j){
      if(x.t==='anchors'||x.t==='divider')return'';
      return'<label class="f row"><input type="checkbox" data-anc="'+i+'" data-tid="'+x.id+'"'+((b.targets||[]).indexOf(x.id)>=0?' checked':'')+'><span>'+(j+1)+'. '+esc(R.blabel(x))+'</span></label>'}).join('');
  }
  if(b.t==='paragraph'||b.t==='list'||b.t==='highlight')rows+='<label class="f"><span>درج لینک داخلی به یکی از مطالب سایت (در جای مکان‌نمای متن)</span><select data-ilk="'+i+'"><option value="">— انتخاب مطلب —</option>'+SITEPOSTS.map(function(p,j){return'<option value="'+j+'">'+esc(p.title)+'</option>'}).join('')+'</select></label>';
  if(b.t==='gate')rows='<div class="note">این بلوک خودش چیزی نشان نمی‌دهد؛ فقط «چند بلوک بعد از خودش» را قفل می‌کند. مثلاً عدد ۳ یعنی سه بلوک پایین این بلوک فقط برای گروه انتخاب‌شده دیده شود. بلوک‌های قفل‌شده در فهرست با 🔒 مشخص می‌شوند. محتوای قفل‌شده داخل صفحهٔ سایت نیست و فقط بعد از بررسی ورود/پرمیوم از ورکر دریافت می‌شود.</div>'+rows;
  var sum=(b.t==='gate'?((b.level==='premium'?'پرمیوم':'لاگین')+' — '+(parseInt(b.count,10)||0)+' بلوک'):(b.text||b.src||b.url||b.label||b.title||'').toString().slice(0,26));
  return'<details class="d"><summary>'+(LOCKS[i]?'🔒 ':'')+(i+1)+'. '+R.BLOCK_NAMES[b.t]+(sum?' — '+esc(sum):'')+'</summary>'+rows+
   '<div class="bar"><button data-a="bup" data-i="'+i+'">⬆️</button><button data-a="bdn" data-i="'+i+'">⬇️</button><button data-a="bdel" data-i="'+i+'">🗑 حذف</button></div></details>';
}

/* ----- تب‌ها ----- */
function gh(){try{return JSON.parse(localStorage.getItem('SR_GH')||'{}')}catch(e){return{}}}
var CATSEL=[['compose','آهنگسازی و تنظیم'],['mixing','میکس و مسترینگ'],['chords','آکوردها'],['sheets','نت‌ها'],['extra','متفرقه (/blog/)']];
var TABS={
 posts:function(){
  var ids=Object.keys(DB.drafts).reverse();
  return'<button class="pb" data-a="new">➕ پست جدید</button><h4 class="g">پیش‌نویس‌های این گوشی</h4>'+
   ids.map(function(id){var d=DB.drafts[id];return'<div class="pl"><span>'+esc(d.title||'(بدون عنوان)')+' <small>'+esc(d.slug)+(id===P._id?' ✔':'')+'</small></span><span class="bar"><button data-a="open" data-id="'+id+'">باز کردن</button><button data-a="rm" data-id="'+id+'">🗑</button></span></div>'}).join('')+
   '<h4 class="g">پست‌های منتشرشده روی سایت</h4><button class="pb s" data-a="site">📥 دریافت فهرست از سایت</button><div id="sitelist"></div>'+
   '<div class="note">پیش‌نویس‌ها فقط روی همین مرورگر ذخیره می‌شوند. برای ویرایش یک پست منتشرشده، از «دریافت فهرست از سایت» همان را باز کن.</div>';
 },
 meta:function(){
  return F('cat','بخش (رنگ و مسیر پست از این می‌آید)','sel',CATSEL)+F('title','عنوان پست')+FL('slug','نشانی کوتاه (فقط حروف انگلیسی کوچک، عدد و -)','text')+
   F('desc','خلاصه (زیر عنوان و توضیح گوگل)','area')+F('img','تصویر شاخص','img')+F('imgAlt','توضیح تصویر شاخص')+F('tag','برچسب (مثلاً پروژه ابلتون)')+
   F('readTime','زمان مطالعه (خالی = خودکار)')+F('date','تاریخ انتشار','date')+F('author','نویسنده')+F('align','چینش متن پاراگراف‌ها','sel',[['justify','دوطرفه (Justify)'],['right','راست‌چین']])+F('comments','بخش نظرات فعال باشد','bool');
 },
 blocks:function(){
  var opts=Object.keys(R.BLOCK_NAMES).map(function(k){return'<option value="'+k+'">'+R.BLOCK_NAMES[k]+'</option>'}).join('');
  return'<div class="f"><span>افزودن بلوک جدید</span><select id="nb">'+opts+'</select></div><button class="pb" data-a="badd">➕ افزودن به انتهای پست</button><h4 class="g">بلوک‌ها (به ترتیب)</h4>'+
   (P.blocks.length?(calcLocks(),P.blocks.map(blockUI)).join(''):'<div class="note">هنوز بلوکی نیست. از بالا اضافه کن.</div>');
 },
 related:function(){
  return'<div class="note">اگر چیزی اینجا نگذاری، سایت خودش چند مطلب هم‌دسته را نشان می‌دهد.</div>'+
   P.related.map(function(r,i){return'<details class="d"><summary>'+(i+1)+'. '+esc(r.title||'مطلب مرتبط')+'</summary>'+
    ['title:عنوان','href:آدرس (مثلاً /compose/xxx/)','img:آدرس تصویر','desc:توضیح کوتاه'].map(function(x){var k=x.split(':');return'<label class="f"><span>'+k[1]+'</span><input type="text" data-r="'+i+'" data-k="'+k[0]+'" value="'+esc(r[k[0]]||'')+'"></label>'}).join('')+
    '<div class="bar"><button data-a="rdel" data-i="'+i+'">🗑 حذف</button></div></details>'}).join('')+'<button class="pb s" data-a="radd">➕ مطلب مرتبط</button>';
 },
 seo:function(){
  var t=(P.seo.title||P.title+' | '+S.site.name),d=P.seo.desc||P.desc,h2=P.blocks.filter(function(b){return b.t==='heading'}).length,imgs=P.blocks.filter(function(b){return b.t==='image'&&!b.alt}).length;
  function ck(ok,txt){return'<div class="'+(ok?'ok':'bad')+'">'+(ok?'✔ ':'✖ ')+txt+'</div>'}
  return F('seo.kw','کلمهٔ کلیدی اصلی (فقط یک عبارت)')+F('seo.title','عنوان سئو (خالی = عنوان پست + نام سایت)')+F('seo.desc','توضیح متا (۱۲۰ تا ۱۶۰ حرف)','area')+F('seo.noindex','پست در گوگل نمایش داده نشود (noindex)','bool')+

/* ----- گیت‌هاب ----- */
function g0(){var g={o:v('gho')||gh().o,r:v('ghr')||gh().r,b:v('ghb')||gh().b||'main',t:v('ght')||gh().t};if(!g.o||!g.r||!g.t)throw new Error('در تب «انتشار» نام کاربری، ریپازیتوری و توکن را پر کن.');localStorage.setItem('SR_GH',JSON.stringify(g));return g}
function gateKey(){var e=document.getElementById('gtk');var k=e?e.value.trim():'';if(k)localStorage.setItem('SR_GATE',k);return k||localStorage.getItem('SR_GATE')||''}
async function gatePut(slug,parts){
  var key=gateKey(),api=(S.site.api||R.DEFAULTS.site.api||'').replace(/\/$/,'');
  if(!key){if(parts.length)throw new Error('این پست بلوک مادر (محتوای ویژه) دارد؛ در تب «انتشار» «کلید محتوای ویژه» را وارد کن.');return false}
  if(!api)throw new Error('آدرس ورکر در تنظیمات سایت خالی است.');
  var r=await fetch(api+'/api/gate/put',{method:'POST',headers:{'Content-Type':'application/json','X-Gate-Key':key},body:JSON.stringify({post:slug,parts:parts})});
  if(!r.ok){var m='';try{m=(await r.json()).error||''}catch(e){}throw new Error('ارسال محتوای ویژه به ورکر شکست خورد ('+r.status+') '+m)}
  return true;
}
function b64(s){return btoa(unescape(encodeURIComponent(s)))}
function ub64(s){return decodeURIComponent(escape(atob(s.replace(/\s/g,''))))}
function H(g){return{Authorization:'Bearer '+g.t,Accept:'application/vnd.github+json'}}
function U(g,p){return'https://api.github.com/repos/'+g.o+'/'+g.r+'/contents/'+p.split('/').map(encodeURIComponent).join('/')}
async function getF(g,p){var r=await fetch(U(g,p)+'?ref='+encodeURIComponent(g.b),{headers:H(g),cache:'no-store'});if(r.status===404)return null;if(!r.ok)throw new Error(p+' → '+r.status);return r.json()}
async function putF(g,p,b64c,msg){
  var cur=await getF(g,p);
  var w=await fetch(U(g,p),{method:'PUT',headers:H(g),body:JSON.stringify({message:msg||('update '+p),content:b64c,branch:g.b,sha:cur?cur.sha:undefined})});
  if(!w.ok)throw new Error(p+' → '+w.status+' '+((await w.json().catch(function(){return{}})).message||''));
}
async function delF(g,p){var cur=await getF(g,p);if(!cur)return;var w=await fetch(U(g,p),{method:'DELETE',headers:H(g),body:JSON.stringify({message:'delete '+p,sha:cur.sha,branch:g.b})});if(!w.ok)throw new Error(p+' → '+w.status)}
function dl(n,c,m){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:m+';charset=utf-8'}));a.download=n;document.body.appendChild(a);a.click();a.remove()}
function out(){var o=clone(P);delete o._id;return o}
function cleanHtml(){var o=out();if(!o.date)o.date=today();return R.postHtml(S,o)}

function shrink(file){return new Promise(function(res){var img=new Image(),u=URL.createObjectURL(file);img.onload=function(){var r=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(function(b){URL.revokeObjectURL(u);res(b||file)},'image/jpeg',.82)};img.onerror=function(){URL.revokeObjectURL(u);res(file)};img.src=u})}

function pageList(posts){
  var u=S.site.url.replace(/\/$/,''),x=['/','/shop/','/tuner/'].concat(Object.keys(R.CATS).filter(function(c){return c!=='extra'}).map(function(c){return R.CATS[c].dir}));

async function readPosts(g){var f=await getF(g,'data/posts.json');if(!f)return[];try{return JSON.parse(ub64(f.content)).posts||[]}catch(e){return[]}}

  posts.sort(function(a,b){return String(b.date).localeCompare(String(a.date))});posts=posts.slice(0,300);
  await putF(g,'data/posts.json',b64(JSON.stringify({posts:posts},null,1)),'update posts index');

}

  await putF(g,'index.html',b64(R.page(S,posts)),'home');log('✓ صفحهٔ اصلی',true);

async function republishAll(){
  try{
    var g=g0();if(!confirm('همهٔ پست‌ها، صفحه‌های دسته و صفحهٔ اصلی دوباره ساخته شوند؟ (چند دقیقه طول می‌کشد)'))return;
    var posts=await readPosts(g),n=0;log('در حال بازسازی '+posts.length+' پست...');
    for(var i=0;i<posts.length;i++){
      var slug=posts[i].href.split('/').filter(Boolean).pop(),f=await getF(g,'data/posts/'+slug+'.json');
      if(!f){log('⚠ منبع پیدا نشد: '+slug,true);continue}

      var gp2=R.gateParts(S,o);if(gp2.length){try{await gatePut(o.slug,gp2)}catch(e){log('⚠ '+o.slug+': '+e.message,true);continue}}

    }
    var cats=[];for(var c in R.CATS){if(c!=='extra')cats.push(c)}

async function publish(){
  try{
    var g=g0(),o=out();
    if(!/^[a-z0-9-]{3,80}$/.test(o.slug))throw new Error('نشانی کوتاه باید ۳ تا ۸۰ حرف انگلیسی کوچک، عدد یا - باشد.');
    if(!o.title.trim())throw new Error('عنوان پست خالی است.');

    if(S.site.url.indexOf('example.com')>=0)log('⚠ آدرس دامنه هنوز example.com است؛ در ساز صفحهٔ اصلی، تب «سایت» اصلاحش کن و دوباره منتشر کن.');
    var ci=R.catInfo(S,o.cat),href=ci.dir+o.slug+'/',base=ci.dir.slice(1)+o.slug;
    var gp=R.gateParts(S,o);log('در حال انتشار...',true);
    if(await gatePut(o.slug,gp))log('✓ محتوای ویژه در ورکر ('+gp.length+' بلوک مادر)',true);
    await putF(g,base+'/index.html',b64(R.postHtml(S,o)),'post '+o.slug);log('✓ صفحهٔ پست',true);
    await putF(g,'data/posts/'+o.slug+'.json',b64(JSON.stringify(o,null,1)),'post source '+o.slug);log('✓ فایل منبع',true);
    var posts=(await readPosts(g)).filter(function(p){return p.href!==href});
    posts.push({cat:o.cat,title:o.title,desc:o.desc,img:o.img,tag:o.tag,meta:R.readMin(o),href:href,date:o.date});
    await writePosts(g,posts);log('✓ فهرست پست‌ها و sitemap',true);
    await rebuildListings(g,posts,[o.cat]);
    log('\nمنتشر شد ✔ تا ~۳۰ ثانیه دیگر:\n'+S.site.url.replace(/\/$/,'')+href,true);
  }catch(er){log('خطا: '+er.message+'\n(توکن یا نام ریپازیتوری را بررسی کن)',true)}
}
async function unpublish(){
  try{
    var g=g0(),o=out();if(!confirm('این پست از سایت حذف شود؟'))return;
    var ci=R.catInfo(S,o.cat),href=ci.dir+o.slug+'/';log('در حال حذف...');
    await delF(g,ci.dir.slice(1)+o.slug+'/index.html');await delF(g,'data/posts/'+o.slug+'.json');try{await gatePut(o.slug,[])}catch(e){log('⚠ '+e.message,true)}
    var posts=(await readPosts(g)).filter(function(p){return p.href!==href});await writePosts(g,posts);
    await rebuildListings(g,posts,[o.cat]);
    log('حذف شد ✔',true);
  }catch(er){log('خطا: '+er.message,true)}
}
async function ensureCats(){
  try{var g=g0();log('در حال ساخت...');
    for(var c in R.CATS){if(c==='extra')continue;var ci=R.catInfo(S,c);await putF(g,ci.dir.slice(1)+'index.html',b64(R.archivePage(S,c,await readPosts(g))),'archive '+c);log('✓ '+ci.dir,true)}
    log('انجام شد ✔',true)}
  catch(er){log('خطا: '+er.message,true)}
}

/* ----- هوش مصنوعی: چینش خودکار متن ----- */
function aiCfg(){try{return JSON.parse(localStorage.getItem('SR_AI')||'{}')}catch(e){return{}}}
var SITEPOSTS=[];
fetch('/data/posts.json',{cache:'no-store'}).then(function(r){return r.ok?r.json():null}).then(function(d){if(d&&d.posts){SITEPOSTS=d.posts;if(typeof cur!=='undefined'&&cur==='blocks')showTab('blocks')}}).catch(function(){});
function aiSys(){
  var core=[{title:'صفحهٔ اصلی',href:'/'},{title:'فروشگاه',href:'/shop/'},{title:'آرشیو آهنگسازی و تنظیم',href:'/compose/'},{title:'آرشیو میکس و مسترینگ',href:'/mixing/'},{title:'آرشیو آکوردها',href:'/chords/'},{title:'آرشیو نت‌ها',href:'/sheets/'}];
  var links=core.concat(SITEPOSTS).filter(function(p){return p.href&&p.title}).slice(0,60).map(function(p){return '- '+p.title+' → '+p.href}).join('\n');
  return 'تو ویراستار و متخصص سئوی فارسی برای یک پست‌ساز وب‌سایت هستی. متن خام یک مقاله می‌آید. فقط و فقط یک شیء JSON معتبر برگردان (بدون توضیح و بدون ```).\n'+
'قالب: {"title":"","slug":"english-short-slug","desc":"","tag":"","seoTitle":"","seoDesc":"","kw":"","blocks":[...]}\n'+
'انواع بلوک: {"t":"heading","level":2 یا 3,"text":""} ، {"t":"paragraph","text":""} ، {"t":"list","text":"هر خط یک مورد"} ، {"t":"highlight","label":"نکتهٔ مهم","text":""} ، {"t":"button","label":"","href":""} ، {"t":"image","src":"","alt":"","caption":""} ، {"t":"video","url":"لینک یوتیوب"} ، {"t":"aparat","url":"لینک آپارات"} ، {"t":"audio","src":"آدرس mp3","title":"","dl":true} ، {"t":"divider"}\n'+
'استانداردهای سئو که باید رعایت شود:\n'+
'۱) title عنوان جذاب ۲۰ تا ۶۵ حرف؛ seoTitle حداکثر ۶۰ حرف و شامل کلمهٔ کلیدی؛ desc و seoDesc هر کدام ۱۲۰ تا ۱۶۰ حرف، روان، شامل کلمهٔ کلیدی و بدون تکرار کامل عنوان.\n'+
'۲) kw یک عبارت اصلی طبیعی (۲ تا ۴ کلمه) باشد که دقیقاً در title، seoTitle، seoDesc، پاراگراف اول و حداقل یکی از headingها آمده باشد.\n'+
'۳) slug فقط حروف انگلیسی کوچک، عدد و خط تیره، ۳ تا ۶ کلمه، ترجمهٔ مفهوم موضوع.\n'+
'۴) ساختار: یک پاراگراف مقدمهٔ کوتاه که با کلمهٔ کلیدی شروع شود؛ سپس حداقل ۳ heading سطح ۲ (توصیفی و حاوی کلمات مرتبط) و در صورت نیاز زیرمجموعه با سطح ۳؛ هیچ سطحی را رد نکن. پاراگراف‌ها ۲ تا ۴ جمله؛ در یک بلوک می‌توانی چند پاراگراف با یک خط خالی بیاوری.\n'+
'۵) نکتهٔ کلیدی/هشدار → highlight (کم، حداکثر ۳ بار)؛ موارد شمارشی → list؛ لینک‌ها به شکل [متن](https://...) حفظ شوند؛ آدرس تصویر/ویدیو/صوت داخل متن به بلوک مناسب تبدیل شود و برای هر تصویر alt فارسی توصیفی (شامل کلمهٔ کلیدی در صورت ارتباط) نوشته شود.\n'+
'۶) در انتهای مقاله یک جمع‌بندی کوتاه (heading + paragraph) بیاور.\n'+
'۷) متن و محتوای نویسنده را حفظ کن؛ چیزی از خودت نساز و حقیقتی اضافه نکن؛ فقط ساختار، تقسیم‌بندی و فیلدهای سئو را بهینه کن. اگر جملهٔ اضافهٔ تکراری یا محاوره‌ای واضح است می‌توانی ویرایش جزئی کنی.\n'+
(links?'۸) لینک داخلی: فهرست صفحات موجود سایت (آرشیوها، فروشگاه و مطالب) در زیر آمده. ۱ تا ۳ مورد که واقعاً مرتبط‌اند را به‌صورت طبیعی داخل متن پاراگراف‌ها با قالب [متن لنگر توصیفی](مسیر) بیاور (متن لنگر عبارت معنادار باشد، نه «اینجا»). اگر هیچ‌کدام مرتبط نیست، لینک نگذار و چیزی نساز.\n'+links:'۸) لینک داخلی: فهرستی در دسترس نیست؛ لینک داخلی نساز.');
}
function aiSave(){var px=document.getElementById('ai_px');localStorage.setItem('SR_AI',JSON.stringify({base:v('ai_base'),key:v('ai_key'),model:v('ai_model'),pk:v('ai_pk'),px:px?px.checked:true}))}
async function callAI(a,url,payload){
  if(a.px!==false){
    if(!a.pk){aiLog('کلید پروکسی را وارد کن (یا تیک «ارسال از طریق ورکر» را بردار).');return null}
    var wk=(S.site.api||R.DEFAULTS.site.api||'').replace(/\/$/,'');if(!wk){aiLog('آدرس ورکر در تنظیمات سایت ثبت نشده است.');return null}
    return fetch(wk+'/api/aiproxy',{method:'POST',headers:{'Content-Type':'application/json','X-Proxy-Key':a.pk},body:JSON.stringify({url:url,key:a.key||'',body:payload})});
  }
  var h={'Content-Type':'application/json'};if(a.key)h.Authorization='Bearer '+a.key;
  return fetch(url,{method:'POST',headers:h,body:JSON.stringify(payload)});
}
function aiLog(t){var s=document.getElementById('st2');if(s)s.textContent=t}
async function aiRun(){
  aiSave();var a=aiCfg(),useP=a.px!==false;
  var txt=(document.getElementById('ai_text').value||'').trim(),mode=v('ai_mode');
  if(!/^https?:\/\//.test(a.base)||!a.model)return aiLog('آدرس API (با https) و نام مدل را وارد کن.');
  if(txt.length<80)return aiLog('متن خیلی کوتاه است.');
  if(txt.length>60000)return aiLog('متن بیش از ۶۰ هزار نویسه است؛ آن را در چند بخش بده.');
  var url=a.base.replace(/\/+$/,'');if(!/\/chat\/completions$/.test(url))url+='/chat/completions';
  aiLog('در حال ارسال... (ممکن است یک دقیقه طول بکشد)');
  try{
    var payload={model:a.model,temperature:.2,messages:[{role:'system',content:aiSys()},{role:'user',content:txt}]};
    var r=await callAI(a,url,payload);
    if(r===null)return;
    var j=await r.json().catch(function(){return null});
    if(!r.ok)throw new Error((j&&(j.error&&(j.error.message||j.error)||j.message))||('خطای '+r.status));
    var c=j&&j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;if(!c)throw new Error('پاسخ خالی بود.');
    c=String(c).replace(/^[\s\S]*?(\{)/,'$1').replace(/\}[^}]*$/,'}');
    var o=JSON.parse(c),n=aiApply(o,mode),iss=aiIssues();
    if(iss.length){
      aiLog('اصلاح خودکار موارد سئو...');
      try{
        var p2={model:a.model,temperature:.2,messages:[{role:'system',content:aiSys()},{role:'user',content:txt},{role:'assistant',content:c},{role:'user',content:'این موارد سئو رعایت نشده است: '+iss.join('؛ ')+'. همان JSON کامل را با اصلاح همین موارد دوباره برگردان (عبارت kw باید عیناً در متن‌های گفته‌شده بیاید). فقط JSON.'}]};
        var r2=await callAI(a,url,p2),j2=await r2.json().catch(function(){return null}),c2=j2&&j2.choices&&j2.choices[0]&&j2.choices[0].message&&j2.choices[0].message.content;
        if(r2.ok&&c2){c2=String(c2).replace(/^[\s\S]*?(\{)/,'$1').replace(/\}[^}]*$/,'}');var o2=JSON.parse(c2);n=aiApply(o2,'replace')}
      }catch(e2){}
    }
    aiLog('انجام شد ✔ '+n+'\nتب «محتوا» را بررسی و اصلاح کن.');
  }catch(er){aiLog('خطا: '+(er.message||er)+'\n(اگر «NetworkError» یا «Failed to fetch» است: تیک «ارسال از طریق ورکر» را بزن.)')}
}
function aiIssues(){
  var k=(P.seo.kw||'').trim(),t=P.seo.title||P.title,d=P.seo.desc||P.desc,fp=(P.blocks.filter(function(b){return b.t==='paragraph'})[0]||{}).text||'',hs=P.blocks.filter(function(b){return b.t==='heading'}).map(function(b){return b.text}).join(' '),w=[];
  if(!k)w.push('kw خالی است');else{
    if(!has(t,k))w.push('عبارت kw دقیقاً در seoTitle نیست');if(!has(d,k))w.push('عبارت kw دقیقاً در seoDesc نیست');
    if(!has(fp,k))w.push('عبارت kw دقیقاً در پاراگراف اول نیست');if(!has(hs,k))w.push('عبارت kw دقیقاً در هیچ‌کدام از headingها نیست')}
  if(d.length<100||d.length>170)w.push('طول seoDesc باید ۱۲۰ تا ۱۶۰ باشد (الان '+d.length+')');
  if((P.seo.title||P.title).length>65)w.push('seoTitle بلندتر از ۶۰ حرف است');
  if(P.blocks.filter(function(b){return b.t==='heading'}).length<3)w.push('کمتر از ۳ heading دارد');
  return w;
}
function aiReport(){
  var w=aiIssues(),il=P.blocks.filter(function(b){return /\]\(\/[^)]/.test(b.text||'')}).length;
  return ' بلوک ساخته شد.\nبررسی سئو: '+(w.join('، ')||'همه چیز خوب است')+'. '+(il?il+' بلوک لینک داخلی دارد.':'لینک داخلی ندارد.');
}
function aiApply(o,mode){
  var OK={heading:['level','text'],paragraph:['text'],list:['text'],highlight:['label','text'],button:['label','href'],image:['src','alt','caption'],video:['url','title'],aparat:['url','title'],audio:['src','title','dl'],divider:[]};
  var bl=(Array.isArray(o.blocks)?o.blocks:[]).filter(function(b){return b&&OK[b.t]}).map(function(b){
    var x={t:b.t,id:bid()};OK[b.t].forEach(function(k){if(b[k]!=null)x[k]=k==='level'?(+b[k]===3?3:2):k==='dl'?!!b[k]:String(b[k])});return x});
  if(!bl.length)throw new Error('بلوکی در پاسخ نبود.');
  if(mode==='replace')P.blocks=bl;else P.blocks=P.blocks.concat(bl);
  var rp=mode==='replace';
  if(o.title&&(rp||!P.title))P.title=String(o.title);
  if(o.desc&&(rp||!P.desc))P.desc=String(o.desc);
  if(o.tag&&(rp||!P.tag))P.tag=String(o.tag);
  if(o.seoTitle&&(rp||!P.seo.title))P.seo.title=String(o.seoTitle);
  if(o.seoDesc&&(rp||!P.seo.desc))P.seo.desc=String(o.seoDesc);
  if(o.kw&&(rp||!P.seo.kw))P.seo.kw=String(o.kw);
  if(o.slug&&/^[a-z0-9-]{3,80}$/.test(String(o.slug))&&(rp||/^post-/.test(P.slug)))P.slug=String(o.slug);
  draw();save();return bl.length+aiReport();
}
